<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Visual Systems</title>
</head>
    <style>
  * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --size-modul: 100px;
            --size-modul-S: calc(var(--size-modul) / 2);
        }
        .inter-unique {
        font-family: "Inter", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-size: 2.5em;
        text-transform: uppercase;
        color: white;
        }
        .container {
            background-color: rgb(252, 254, 229);
            height: 100vh;
            width: 100vw;
            display: flex;
        }
        header {
            display: flex;
            width: 100%;
            height: 50%;
        }
        #one {
            width: 50%;
            height: 100%;
            flex-grow: 1;
            background-color: rgb(8, 0, 167);
        }
        #two {
            width: 50%;
            height: 100%;

        }
        main {
            display: flex;
            width: 100%;
            height: 50%;
        }
        #autor, #estudi {
            height: 100%;
            flex-grow: 1;
            width: 50%;
            flex-direction: column; 
        }
        header, #autor, #estudi {
            padding: 18px 0 0 10px;
        }
        #mXL {
            height: 50%;
            width: 100%;  
            position: relative;

        }
        #mXL > .top  {
            position: absolute;
            top: 0;
            left: var(--size-modul);
            right: var(--size-modul);
            height: var(--size-modul);
            background: green
        }
        #mXL > .right {
            position: absolute;
            top: var(--size-modul);
            bottom: var(--size-modul);
            right: 0;
            width: var(--size-modul);
            background: green
        }
        #mXL > .bottom {
            position: absolute;
            bottom: 0;
            left: var(--size-modul);
            right: var(--size-modul);
            height: var(--size-modul);
            background: green
        }
        #mXL > .left {
            position: absolute;
            top: var(--size-modul);
            bottom: var(--size-modul);
            left: 0;
            width: var(--size-modul);
            background: green
        }
        #mS
        {
            display: flex;
            height: 25%;
            width: 100%;  
        }
        .mXS {
            height: 100%;
            width: 50%;  
            position: relative;

        }
        .mXS >  .top  {
            position: absolute;
            top: 0;
            left: var(--size-modul-S);
            right: var(--size-modul-S);
            height: var(--size-modul-S);
            background: green
        }
        .mXS >  .right {
            position: absolute;
            top: var(--size-modul-S);
            bottom: var(--size-modul-S);
            right: 0;
            width: var(--size-modul-S);
            background: green
        }
        .mXS >  .bottom {
            position: absolute;
            bottom: 0;
            left: var(--size-modul-S);
            right: var(--size-modul-S);
            height: var(--size-modul-S);
            background: green
        }
        .mXS >  .left {
            position: absolute;
            top: var(--size-modul-S);
            bottom: var(--size-modul-S);
            left: 0;
            width: var(--size-modul-S);
            background: green
        } 
        #mS2 {
            height: 25%;
            width: 100%;  
            position: relative;

        }
        #mS2 >  .top  {
            position: absolute;
            top: 0;
            left:  var(--size-modul);
            right:  var(--size-modul);
            height:  var(--size-modul-S);
            background: green
        }
        #mS2 >  .right {
            position: absolute;
            top:  var(--size-modul-S);
            bottom:  var(--size-modul-S);
            right: 0;
            width:  var(--size-modul);
            background: green
        }
        #mS2 >  .bottom {
            position: absolute;
            bottom: 0;
            left:  var(--size-modul);
            right:  var(--size-modul);
            height:  var(--size-modul-S);
            background: green
        }
        #mS2 >  .left {
            position: absolute;
            top:  var(--size-modul-S);
            bottom:  var(--size-modul-S);
            left: 0;
            width:  var(--size-modul);
            background: green
        } 
        @media only screen and (max-width: 375px) {
            .container {
                flex-direction: column; 
                width: 100%;
                height: 200vh;
            }
            #one, #two {
                display: flex;
                flex-direction: column;
                width: 100%;
                height: 100vh;
            }
            :root {
                --size-modul: 50px;
                --size-modul-S: calc(var(--size-modul) / 2);
            }
        }

    </style>
<body>
    <div class="container">
        <div id="one">
            <header>
                <h1 class="inter-unique">Flexible Visual Systems</h1>
            </header>
            <main>
                <div id="autor">
                    <h2 class="inter-unique">ML</h2>
                </div>
                <div id="estudi">
                    <h2 class="inter-unique">hh</h2>
                    <h2 class="inter-unique">bcn</h2>
                </div>
            </main>
        </div>
        <div id="two">
            <div id="mXL">
                <div class="top"></div>
                <div class="right"></div>
                <div class="bottom"></div>
                <div class="left"></div>
            </div>
            <div id="mS">
                <div class="mXS">
                    <div class="top"></div>
                    <div class="right"></div>
                    <div class="bottom"></div>
                    <div class="left"></div>
                </div>
                <div class="mXS">
                    <div class="top"></div>
                    <div class="right"></div>
                    <div class="bottom"></div>
                    <div class="left"></div>
                </div>
            </div>
            <div id="mS2">
                <div class="top"></div>
                <div class="right"></div>
                <div class="bottom"></div>
                <div class="left"></div>
            </div>
    </div>
</body>
</html>
